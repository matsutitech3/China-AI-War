name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures lmodern
      - name: Build both editions
        run: make all
      - name: Check references
        run: make check && make check-condensed
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            How-China-Will-Win-the-AI-War-*.pdf
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: How-China-Will-Win-the-AI-War-*.pdf
